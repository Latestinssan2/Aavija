# Gradle build settings.

# Force the Gradle daemon to run on JDK 17. Your default `java` is 26, which is
# too new for the Android Gradle Plugin — 17 is the required stable version.
org.gradle.java.home=/opt/homebrew/Cellar/openjdk@17/17.0.20.1/libexec/openjdk.jdk/Contents/Home

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
