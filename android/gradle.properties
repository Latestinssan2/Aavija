# Gradle build settings.

# Force the Gradle daemon to run on JDK 17. Your default `java` is 26, which is
# too new for the Android Gradle Plugin — 17 is the required stable version.
# org.gradle.java.home is intentionally unset so CI's JDK 17 is used.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
