# XcodeGen spec — run `xcodegen generate` in this folder to (re)build Aavija.xcodeproj
name: Aavija
options:
  bundleIdPrefix: com.preet
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Aavija:
    type: application
    platform: macOS
    sources:
      - path: Aavija
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.preet.aavija
        PRODUCT_NAME: Aavija
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Aavija/Info.plist
        CODE_SIGN_ENTITLEMENTS: Aavija/Aavija.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_IDENTITY: "-"
    info:
      path: Aavija/Info.plist
      properties:
        LSUIElement: true            # app is an "agent": menu-bar only, NO Dock icon
        CFBundleDisplayName: Aavija
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"

schemes:
  Aavija:
    build:
      targets:
        Aavija: all
    run:
      config: Debug
