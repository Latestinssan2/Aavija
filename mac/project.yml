# XcodeGen spec — run `xcodegen generate` in this folder to (re)build Aavija.xcodeproj
name: Aavija
options:
  bundleIdPrefix: com.aartiq
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Aavija:
    type: application
    platform: macOS
    sources:
      - path: Aavija
        excludes:
          - Aavija.requirements
    settings:
      base:
        # NOTE: was com.preet.aavija — macOS had recorded a silent Local-Network
        # DENY for that ID (made before we added NSLocalNetworkUsageDescription,
        # so it never prompted and never asks again). New ID = fresh start, so
        # the app can trigger the real consent prompt.
        PRODUCT_BUNDLE_IDENTIFIER: com.aartiq.aavija.mac
        PRODUCT_NAME: Aavija
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Aavija/Info.plist
        CODE_SIGN_ENTITLEMENTS: Aavija/Aavija.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_IDENTITY: "-"
        # Without this, an ad-hoc signature's designated requirement is just the
        # binary's cdhash — which changes on every rebuild. macOS then treats the
        # new build as a different app and asks for Screen Recording again.
        # Pinning the requirement to the bundle identifier keeps one TCC grant
        # valid across rebuilds. (Local development only: the app is ad-hoc
        # signed, not distributed.)
        OTHER_CODE_SIGN_FLAGS: "--requirements $(SRCROOT)/Aavija/Aavija.requirements"
    info:
      path: Aavija/Info.plist
      properties:
        LSUIElement: true            # app is an "agent": menu-bar only, NO Dock icon
        CFBundleDisplayName: Aavija
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Local Network privacy: without these, macOS 26/27 may silently
        # refuse Bonjour advertising instead of showing the consent prompt.
        NSLocalNetworkUsageDescription: "Aavija finds and shares files with your devices on this Wi-Fi."
        NSCameraUsageDescription: "Aavija uses the camera to detect hand gestures. The camera runs only while Gesture mode is on; no video is recorded or sent."
        NSScreenCaptureUsageDescription: "Aavija captures your screen when you grab with no file selected to share it."
        NSBonjourServices:
          - _gestureshare._tcp
          # Phase 5a: the Mac's OWN announcement, so a phone can list this
          # machine as an available device (distinct from the phone's service).
          - _aavija-mac._tcp

schemes:
  Aavija:
    build:
      targets:
        Aavija: all
    run:
      config: Debug
