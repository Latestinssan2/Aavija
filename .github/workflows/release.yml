name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Aavija.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aavija-android
          path: artifacts/Aavija.apk

  build-macos:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd mac
          xcodegen generate --spec project.yml

      - name: Build macOS App
        run: |
          cd mac
          xcodebuild -project Aavija.xcodeproj \
                     -scheme Aavija \
                     -configuration Debug \
                     -destination 'generic/platform=macOS' \
                     build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package DMG and Zip
        run: |
          mkdir -p artifacts
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Aavija.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          
          # Create zip
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/Aavija-macOS.app.zip
          
          # Create DMG
          mkdir -p /tmp/dmg_staging
          cp -R "$APP_PATH" /tmp/dmg_staging/
          ln -s /Applications /tmp/dmg_staging/Applications
          hdiutil create -volname "Aavija" -srcfolder /tmp/dmg_staging -ov -format UDZO artifacts/Aavija-macOS.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aavija-macos
          path: artifacts/*

  build-windows:
    name: Build Windows EXE and MSIX
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore windows/AavijaWindows/AavijaWindows.csproj

      - name: Build Windows EXE
        run: |
          dotnet publish windows/AavijaWindows/AavijaWindows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o artifacts/windows-exe

      - name: Prepare MSIX
        shell: pwsh
        run: |
          $staging = "artifacts/windows-msix"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "artifacts/windows-exe/*" $staging -Recurse -Force
          Copy-Item "windows/AavijaWindows/Package.appxmanifest" $staging/AppxManifest.xml -Force
          # MakeAppx requires logo assets; copy them if present.
          if (Test-Path "windows/AavijaWindows/Assets") {
            New-Item -ItemType Directory -Force -Path "$staging/Assets" | Out-Null
            Copy-Item "windows/AavijaWindows/Assets/*" "$staging/Assets" -Recurse -Force
          }
          # Create an unsigned MSIX for distribution/testing.
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64"
          if (-not (Test-Path "$sdk\makeappx.exe")) {
            $sdk = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\x64"
          }
          & "$sdk\makeappx.exe" pack /d $staging /p artifacts/Aavija-windows.msix /nv
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed" }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aavija-windows
          path: |
            artifacts/windows-exe/Aavija.exe
            artifacts/Aavija-windows.msix

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Prepare Release Directory
        run: |
          mkdir -p dist
          find release-files -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Determine Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
          name: "Aavija ${{ steps.tag.outputs.RELEASE_TAG }}"
          body: |
            ### આવી જા (Aavija) — Gesture AirDrop over Local Wi-Fi
            
            Instant, zero-cloud peer-to-peer sharing between macOS and Android powered by natural hand gestures and TLS 1.3 encryption.
            
            #### 📦 Downloads:
            - **macOS Apple Silicon / Intel**: [`Aavija-macOS.dmg`](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.RELEASE_TAG }}/Aavija-macOS.dmg) or [`Aavija-macOS.app.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.RELEASE_TAG }}/Aavija-macOS.app.zip)
            - **Android (ARM64 / Universal)**: [`Aavija.apk`](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.RELEASE_TAG }}/Aavija.apk)
            
            #### ✨ Highlights:
            - **Hand Gesture Sharing**: GRAB on Mac $\rightarrow$ RELEASE on Phone to stream in milliseconds.
            - **Full Screen Edge-to-Edge Viewer**: With multi-touch pinch, zoom, and pan.
            - **Magic Blackout Screen Mode**: Background gesture camera with hidden system bars.
            - **Screen & Active App Sharing**: Choose between entire screen or frontmost app capture.
            - **Local Security**: 6-digit PIN pairing, certificate fingerprint pinning, no cloud tracking.
          files: |
            dist/Aavija.apk
            dist/Aavija-macOS.dmg
            dist/Aavija-macOS.app.zip
            dist/Aavija.exe
            dist/Aavija-windows.msix
          draft: false
          prerelease: false
